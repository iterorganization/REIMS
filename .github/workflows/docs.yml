name: Documentation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  docs-html:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Graphviz
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz latexmk make texlive-fonts-recommended texlive-latex-extra texlive-latex-recommended xindy

      - name: Install Python documentation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build FORD documentation
        shell: bash
        run: |
          cd docs
          ford ford_doc.md

      - name: Build Sphinx documentation and PDFs
        shell: bash
        run: |
          cd tools
          python yaml_to_json.py

          cd ../docs/user
          make html
          make latex
          python fix_latex.py
          make -C _build/latex all-pdf

          cd ../dll
          sphinx-build -M html . _build
          sphinx-build -M latex . _build
          make -C _build/latex all-pdf

      - name: Stage documentation site
        shell: bash
        run: |
          site_dir="$GITHUB_WORKSPACE/site"
          rm -rf "$site_dir"
          mkdir -p "$site_dir/user/_build/html" "$site_dir/user/_build/latex" "$site_dir/dll/_build/html" "$site_dir/dll/_build/latex" "$site_dir/tools"

          cp -r "$GITHUB_WORKSPACE/docs/ford_generated" "$site_dir/ford_generated"
          cp -r "$GITHUB_WORKSPACE/docs/user/_build/html/." "$site_dir/user/_build/html"
          cp -r "$GITHUB_WORKSPACE/docs/dll/_build/html/." "$site_dir/dll/_build/html"
          cp "$GITHUB_WORKSPACE/tools/reims_schema.json" "$site_dir/tools/reims_schema.json"

          find "$GITHUB_WORKSPACE/docs/user/_build/latex" -maxdepth 1 -name '*.pdf' -exec cp {} "$site_dir/user/_build/latex/" \;
          find "$GITHUB_WORKSPACE/docs/dll/_build/latex" -maxdepth 1 -name '*.pdf' -exec cp {} "$site_dir/dll/_build/latex/" \;

          cat > "$site_dir/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>REIMS Documentation</title>
          </head>
          <body>
            <h1>REIMS Documentation</h1>
            <ul>
              <li><a href="user/_build/html/index.html">User manual</a></li>
              <li><a href="dll/_build/html/index.html">DLL developer guide</a></li>
              <li><a href="ford_generated/index.html">FORD reference</a></li>
              <li><a href="user/_build/latex/reims.pdf">User manual PDF</a></li>
              <li><a href="dll/_build/latex/reimsdlldeveloperguide.pdf">DLL developer guide PDF</a></li>
              <li><a href="tools/reims_schema.json">JSON schema</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reims-documentation
          path: site/**
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy documentation site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: docs-html
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4