name: Windows Artifact

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-oneapi:
    name: Windows oneAPI artifact build
    runs-on: windows-2022

    env:
      HDF5_ARTIFACT_NAME: hdf5-intel-static-fortran
      HDF5_ARTIFACT_REPO: kosiu/hdf5-build
      ONEAPI_ROOT: C:\Program Files (x86)\Intel\oneAPI
      ONEAPI_INSTALLER_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e63ac2b4-8a9a-4768-979a-399a8b6299de/intel-oneapi-hpc-toolkit-2025.2.1.46_offline.exe

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.0
          ninjaVersion: latest

      - name: Install Intel oneAPI HPC Toolkit
        shell: cmd
        run: |
          curl.exe --output "%TEMP%\webimage.exe" --url "%ONEAPI_INSTALLER_URL%" --retry 5 --retry-delay 5
          start /b /wait "" "%TEMP%\webimage.exe" -s -x -f
          "%TEMP%\webimage_extracted" --log "%TEMP%\extract.log"
          "%TEMP%\webimage_extracted\bootstrapper.exe" -s --action install --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir="%TEMP%\intel-install-logs"

      - name: Activate Intel oneAPI environment
        shell: cmd
        run: |
          ver | findstr /i "10\.0\.17" && set VS2019INSTALLDIR=C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise
          ver | findstr /i "10\.0\.20" && set VS2022INSTALLDIR=C:\Program Files\Microsoft Visual Studio\2022\Enterprise
          call "%ONEAPI_ROOT%\setvars.bat"
          set SETVARS_COMPLETED=1
          set FC=ifx
          set CC=icx
          set CXX=icx
          set FPM_FC=ifx
          set FPM_CC=icx
          set FPM_CXX=icx
          set | findstr /c:"oneAPI" >> "%GITHUB_ENV%"
          echo SETVARS_COMPLETED=1>>"%GITHUB_ENV%"
          echo FC=ifx>>"%GITHUB_ENV%"
          echo CC=icx>>"%GITHUB_ENV%"
          echo CXX=icx>>"%GITHUB_ENV%"
          echo FPM_FC=ifx>>"%GITHUB_ENV%"
          echo FPM_CC=icx>>"%GITHUB_ENV%"
          echo FPM_CXX=icx>>"%GITHUB_ENV%"

      - name: Verify Intel oneMKL files
        shell: pwsh
        run: |
          $requiredPaths = @(
            (Join-Path $env:ONEAPI_ROOT 'mkl/latest/include/mkl_pardiso.f90'),
            (Join-Path $env:ONEAPI_ROOT 'mkl/latest/lib/mkl_blas95_lp64.lib'),
            (Join-Path $env:ONEAPI_ROOT 'mkl/latest/lib/mkl_lapack95_lp64.lib')
          )

          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) {
              throw "Missing required Intel oneMKL file: $path"
            }
          }

      - name: Download latest HDF5 install artifact
        shell: pwsh
        env:
          GH_TOKEN_FALLBACK: ${{ github.token }}
          GH_TOKEN_CROSS_REPO: ${{ secrets.HDF5_BUILD_TOKEN }}
        run: |
          $token = if ($env:GH_TOKEN_CROSS_REPO) { $env:GH_TOKEN_CROSS_REPO } else { $env:GH_TOKEN_FALLBACK }
          $headers = @{ 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($token) {
            $headers.Authorization = "Bearer $token"
          }

          $artifactsUri = "https://api.github.com/repos/$env:HDF5_ARTIFACT_REPO/actions/artifacts?per_page=100"
          $response = Invoke-RestMethod -Uri $artifactsUri -Headers $headers
          $artifact = $response.artifacts |
            Where-Object { $_.name -eq $env:HDF5_ARTIFACT_NAME -and -not $_.expired } |
            Sort-Object updated_at -Descending |
            Select-Object -First 1

          if (-not $artifact) {
            throw "Could not find a non-expired artifact named '$env:HDF5_ARTIFACT_NAME' in $env:HDF5_ARTIFACT_REPO"
          }

          $zipPath = Join-Path $env:RUNNER_TEMP 'hdf5-intel-static-fortran.zip'
          $downloadUri = "https://api.github.com/repos/$env:HDF5_ARTIFACT_REPO/actions/artifacts/$($artifact.id)/zip"
          Invoke-WebRequest -Uri $downloadUri -Headers $headers -OutFile $zipPath

          $extractPath = Join-Path $env:RUNNER_TEMP 'hdf5-artifact'
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath

          $configFile = Get-ChildItem -Path $extractPath -Recurse -Filter 'hdf5-config.cmake' -File | Select-Object -First 1
          if (-not $configFile) {
            throw 'The downloaded HDF5 artifact does not contain cmake/hdf5-config.cmake'
          }

          $hdf5Root = Split-Path (Split-Path $configFile.FullName -Parent) -Parent
          "HDF5_ROOT=$hdf5Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HDF5_DIR=$(Join-Path $hdf5Root 'cmake')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HDF5_BUILD_DIR=$hdf5Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$hdf5Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset build-ninja-release -S . --fresh `
            -D HDF5_ROOT="$env:HDF5_ROOT" `
            -D HDF5_DIR="$env:HDF5_DIR" `
            -D HDF5_BUILD_DIR="$env:HDF5_BUILD_DIR" `
            -D CMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset ninja-release

      - name: Stage executable artifact
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:GITHUB_WORKSPACE 'artifact/reims'
          if (Test-Path $stageDir) {
            Remove-Item $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null

          $exePath = Join-Path $env:GITHUB_WORKSPACE 'build-ninja-release/src/reims.exe'
          if (-not (Test-Path $exePath)) {
            throw "Expected build output not found: $exePath"
          }
          Copy-Item -Path $exePath -Destination $stageDir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reims-windows-oneapi
          path: artifact/reims/**
          if-no-files-found: error